  <script>
    (function () {
      function buildTimeline() {
        var g = window.gsap;
        if (!g) return;

        var D = 5.099;
        var tl = g.timeline({ paused: true });

        /* ---- 1 · chrome + claim land (hero readable by ~0.5s) ---- */
        tl.fromTo(
          ".f06-locks-chrome",
          { opacity: 0 },
          { opacity: 1, duration: 0.26, ease: "none" },
          0.04
        );
        tl.fromTo(
          ".f06-locks-rule",
          { scaleX: 0, transformOrigin: "left center" },
          { scaleX: 1, duration: 0.42, ease: "power2.out" },
          0.06
        );
        tl.fromTo(
          ".f06-locks-kicker",
          { opacity: 0, y: -16 },
          { opacity: 1, y: 0, duration: 0.36, ease: "power3.out" },
          0.1
        );
        tl.fromTo(
          ".f06-locks-head-l1",
          { opacity: 0, x: -44 },
          { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" },
          0.12
        );
        // The second word starts only once the first has settled — sliding in
        // at 0.2 put it on top of the still-moving first word, and the two
        // read as one overlapping block for the whole entrance.
        tl.fromTo(
          ".f06-locks-head-l2",
          { opacity: 0, x: -44 },
          { opacity: 1, x: 0, duration: 0.44, ease: "power3.out" },
          0.58
        );

        /* ---- 2 · the stack lands, then locks arrive one at a time ---- */
        tl.fromTo(
          ".f06-locks-stack",
          { y: 26 },
          { y: 0, duration: 0.55, ease: "power3.out" },
          0.92
        );

        var rowIn = [1.02, 2.0, 2.98];
        var hit = [1.55, 2.53, 3.51];
        var amp = [1, 1.18, 1.65];
        var blip = [0.18, 0.22, 0.42];

        for (var i = 0; i < 3; i++) {
          var n = i + 1;
          var row = ".f06-locks-row[data-row='" + n + "']";
          var inner = row + " .f06-locks-row-in";
          var lock = row + " .f06-locks-lock";
          var scan = row + " .f06-locks-scan";
          var chipOn = row + " .f06-locks-cnt-on";
          var chipOff = row + " .f06-locks-cnt-off";
          var a = amp[i];
          var t0 = rowIn[i];
          var T = hit[i];
          var h = blip[i];

          /* the row prints in from up-left, the padlock snaps to scale */
          tl.fromTo(
            row,
            { opacity: 0, y: -42, x: -20 },
            { opacity: 1, y: 0, x: 0, duration: 0.42, ease: "power3.out" },
            t0
          );
          tl.fromTo(
            lock,
            { scale: 0.55 },
            { scale: 1, duration: 0.46, ease: "back.out(2.4)" },
            t0 + 0.06
          );

          /* the unlock attempt sweeps the row — and runs into the shackle */
          tl.fromTo(
            scan,
            { scaleX: 0, transformOrigin: "left center" },
            { scaleX: 1, duration: 0.22, ease: "none" },
            T - 0.05
          );
          tl.to(scan, { opacity: 1, duration: 0.04, ease: "none" }, T - 0.05);
          tl.to(scan, { opacity: 0, duration: 0.16, ease: "none" }, T + 0.17);

          /* the lock body jolts hard — the last one hardest — and never throws */
          tl.fromTo(
            inner,
            { x: -9 * a },
            { x: 6 * a, duration: 0.06, ease: "none", immediateRender: false },
            T
          );
          tl.to(inner, { x: -5 * a, duration: 0.06, ease: "none" }, T + 0.06);
          tl.to(inner, { x: 3 * a, duration: 0.05, ease: "none" }, T + 0.12);
          tl.to(inner, { x: -1.5 * a, duration: 0.05, ease: "none" }, T + 0.17);
          tl.to(inner, { x: 0, duration: 0.14, ease: "power2.out" }, T + 0.22);

          /* status blips to nothing, then snaps back to LOCKED and stays there */
          tl.to(chipOn, { opacity: 0, duration: 0.05, ease: "none" }, T + 0.02);
          tl.to(chipOff, { opacity: 1, duration: 0.05, ease: "none" }, T + 0.02);
          tl.to(chipOn, { opacity: 1, duration: 0.05, ease: "none" }, T + 0.02 + h);
          tl.to(chipOff, { opacity: 0, duration: 0.05, ease: "none" }, T + 0.02 + h);
        }

        /* ---- 3 · the verdict, after the last refusal settles ---- */
        tl.fromTo(
          ".f06-locks-verdict",
          { opacity: 0, x: 36 },
          { opacity: 1, x: 0, duration: 0.42, ease: "power3.out" },
          3.95
        );

        /* ---- 4 · the guardrail rule: clamp rather than scale up ---- */
        tl.fromTo(
          ".f06-locks-marker",
          { opacity: 0, x: -40 },
          { opacity: 1, x: 0, duration: 0.44, ease: "power3.out" },
          4.12
        );
        tl.fromTo(
          ".f06-locks-mk-kick",
          { opacity: 0 },
          { opacity: 1, duration: 0.18, ease: "none" },
          4.26
        );
        tl.fromTo(
          ".f06-locks-mk-big",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.34, ease: "power3.out" },
          4.32
        );

        /* the meter fills to the ceiling, tries to overshoot, gets clamped back */
        tl.fromTo(
          ".f06-locks-bar-fill",
          { scaleX: 0, transformOrigin: "left center" },
          { scaleX: 0.62, duration: 0.3, ease: "power2.out" },
          4.56
        );
        tl.to(
          ".f06-locks-bar-fill",
          { scaleX: 0.94, duration: 0.14, ease: "power2.in" },
          4.86
        );
        tl.fromTo(
          ".f06-locks-bar-tick",
          { opacity: 0.55 },
          { opacity: 1, duration: 0.08, ease: "none" },
          4.98
        );
        tl.to(
          ".f06-locks-bar-fill",
          { scaleX: 0.62, duration: 0.09, ease: "power3.out" },
          5.0
        );

        /* hold the landed state to the end of the frame — no exit */
        tl.to({ v: 0 }, { v: 1, duration: 0.001 }, D - 0.001);

        window.__timelines = window.__timelines || {};
        window.__timelines["06-locks"] = tl;
        tl.seek(0);
      }

      if (window.gsap) {
        buildTimeline();
      } else {
        window.addEventListener("load", buildTimeline, { once: true });
      }
    })();
