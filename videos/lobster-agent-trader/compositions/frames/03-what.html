        var tl = gsap.timeline({ paused: true });

        // ---- measure every stroked element; dash = length, offset = length ----

          if (!el) return;
          var len;
          if (q === "#f03-what-rail") {
            len = el.getTotalLength();
          } else {
            // circle perimeter from the real r attribute
            len = 2 * Math.PI * parseFloat(el.getAttribute("r"));
          }
          len = len * 1.02; // slight overestimate so the stroke end isn't clipped
          el.style.strokeDasharray = len;
          el.style.strokeDashoffset = len;
        });

        // ============ SCENE A — name it (0.0 → ~1.6s) ============

            ease: "power2.out",

          1.7
