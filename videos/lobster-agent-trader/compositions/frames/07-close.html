  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var DURATION = 2.603;
      var ADDRESS = "github.com/projectlobster/Lobster-Agent-Trader";

      var mark = document.querySelector("#f07-close-markwrap");
      var letters = document.querySelectorAll(".f07-close-l");
      var rule = document.querySelector("#f07-close-rule");
      var addrEl = document.querySelector("#f07-close-addr");
      var caret = document.querySelector("#f07-close-caret");
      var frame = document.querySelectorAll(".f07-close-bar, .f07-close-plate");
      var chips = document.querySelectorAll(".f07-close-chip");

      var tl = gsap.timeline({ paused: true });

      // Scene 1 — the stage is prepared: the hairline stage + mono chrome settle in.
      tl.fromTo(
        frame,
        { opacity: 0 },
        { opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.08 },
        0.06,
      );
      tl.fromTo(
        chips,
        { opacity: 0, y: 6 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.06 },
        0.16,
      );

      // Scene 2a — whole-mark spring BLOOM from zero at the lockup's centre.
      tl.fromTo(
        mark,
        { scale: 0, opacity: 0, rotation: -9 },
        { scale: 1, opacity: 1, rotation: 0, duration: 0.5, ease: "back.out(1.9)" },
        0.04,
      );

      // Scene 2b — the wordmark cascades in beside it, letter by letter, left to right.
      tl.fromTo(
        letters,
        { opacity: 0, y: 14, scaleY: 0.86 },
        { opacity: 1, y: 0, scaleY: 1, duration: 0.18, ease: "back.out(1.8)", stagger: 0.012 },
        0.5,
      );

      // Scene 3 — the address types on beneath the lockup, while the mint hairline draws.
      var type = { v: 0 };
      tl.to(
        type,
        {
          v: ADDRESS.length,
          duration: 0.58,
          ease: "power1.inOut",
          onUpdate: function () {
            addrEl.textContent = ADDRESS.substring(0, Math.floor(type.v));
          },
        },
        0.92,
      );

      // block cursor — deterministic sin square wave on the timeline, never a CSS animation
      var blink = { p: 0 };
      tl.to(
        blink,
        {
          p: Math.PI * 2 * 1.7,
          duration: 0.58,
          ease: "none",
          onUpdate: function () {
            caret.style.opacity = Math.sin(blink.p) > 0 ? "1" : "0";
          },
        },
        0.92,
      );
      tl.to(caret, { opacity: 0, duration: 0.1, ease: "none" }, 1.5);

      // the single accent: a mint hairline sweeps left to right beneath the address
      tl.fromTo(rule, { scaleX: 0 }, { scaleX: 1, duration: 0.48, ease: "power3.inOut" }, 1.02);

      // full-span anchor so the sub-composition timeline covers the whole frame
      tl.to({}, { duration: DURATION }, 0);

      window.__timelines["07-close"] = tl;
    })();
