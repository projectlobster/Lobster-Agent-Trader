  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var D = 4.267;
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var MAX = 1000000;
      var DEEP = "#15803d";
      var INK = "#12101c";

      // the counter is a pure function of timeline progress, so every seek
      // lands on the same frame: fall to zero, hold, then keep going negative
      var T0 = 0.15; // drain starts on "you pay for"
      var SPAN = 4.05; // T0 + SPAN = 4.20, inside the 4.267s cut
      var P_ZERO = (2.4 - T0) / SPAN; // zero lands at 2.40s
      var P_HOLD = (2.95 - T0) / SPAN; // the sting holds to 2.95s
      var OVER = 280000; // how far past zero it runs
      var state = { p: 0 };

      var numEl = document.getElementById("p01-num");
      var fillEl = document.getElementById("p01-fill");
      var spillEl = document.getElementById("p01-spill-fill");

      function clamp(v, a, b) {
        return v < a ? a : v > b ? b : v;
      }

      function value(p) {
        if (p < P_ZERO) {
          var u = p / P_ZERO;
          return MAX * (1 - Math.pow(u, 1.3));
        }
        if (p < P_HOLD) {
          return 0; // the hold on zero — this is the sting
        }
        var u2 = (p - P_HOLD) / (1 - P_HOLD);
        return -OVER * Math.pow(u2, 1.15);
      }

      function group(n) {
        return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      }

      function paint() {
        var v = value(state.p);
        numEl.textContent = (v < 0 ? "\u2212" : "") + group(Math.abs(Math.round(v)));
        numEl.style.color = v < 0 ? DEEP : INK;
        fillEl.style.width = (clamp(v / MAX, 0, 1) * 100).toFixed(2) + "%";
        spillEl.style.width = (clamp(-v / MAX / 0.3, 0, 1) * 100).toFixed(2) + "%";
      }

      paint();

      // ——— the counter: 1,000,000 → 0 → negative, one deterministic tween ———
      tl.to(state, { p: 1, duration: SPAN, ease: "none", onUpdate: paint }, T0);

      // ——— cold open, then the chrome settles in ———
      tl.fromTo("#p01-topbar", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.04);
      tl.fromTo(
        "#p01-kicker",
        { opacity: 0, x: -14 },
        { opacity: 1, x: 0, duration: 0.38, ease: "power2.out" },
        0.12
      );
      tl.fromTo(
        "#p01-label-row",
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        0.34
      );
      tl.fromTo(
        "#p01-meter",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.5
      );

      // ——— 2.40s: it hits zero and the impact settles ———
      tl.fromTo(
        "#p01-num",
        { scale: 1.09 },
        { scale: 1, duration: 0.5, ease: "power4.out" },
        2.4
      );

      // ——— 2.42s: the zero line is drawn across the frame, and it stays ———
      tl.fromTo(
        "#p01-zero-rule",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.22, ease: "power3.out" },
        2.42
      );

      // ——— 2.95s: past zero — the counter keeps burning, the meter spills ———
      tl.fromTo(
        "#p01-spill",
        { height: 0 },
        { height: "1.9cqw", duration: 0.22, ease: "power3.out" },
        2.95
      );
      tl.fromTo(
        "#p01-deficit",
        { opacity: 0, y: -6 },
        { opacity: 1, y: 0, duration: 0.28, ease: "power2.out" },
        2.98
      );

      // ——— 2.95s: "unused" lands, mint tint, hard offset shadow ———
      tl.fromTo(
        "#p01-unused",
        { opacity: 0, yPercent: -10, scale: 1.045 },
        { opacity: 1, yPercent: 0, scale: 1, duration: 0.28, ease: "back.out(2.6)" },
        2.95
      );
      tl.fromTo(
        "#p01-unused-sub",
        { opacity: 0 },
        { opacity: 1, duration: 0.35, ease: "power2.out" },
        3.22
      );

      // ——— meta footer settles late ———
      tl.fromTo(
        "#p01-meta",
        { opacity: 0, y: 8 },
        { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
        3.5
      );

      // ——— a quiet camera drift under the whole shot ———
      tl.fromTo("#p01-hero", { y: 0 }, { y: -16, duration: D, ease: "none" }, 0);
      tl.fromTo("#p01-grid", { scale: 1 }, { scale: 1.05, duration: D, ease: "none" }, 0);
      tl.to({}, { duration: D }, 0);

      window.__timelines["01-hook"] = tl;
      tl.seek(0);
    })();
  </script>
