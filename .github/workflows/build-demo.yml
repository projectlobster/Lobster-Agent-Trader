name: Build demo

# Builds the static landing page and uploads it as an artifact. The deploy half
# lives in deploy-demo.yml, which runs on gh-pages because the github-pages
# environment's branch policy admits only that branch — a deployment job
# triggered from main is rejected by the policy.
on:
  push:
    branches: [main]
    paths:
      - "src/app/page.tsx"
      - "src/app/layout.tsx"
      - "src/app/globals.css"
      - "src/components/site/**"
      - "src/components/ui/**"
      - "scripts/build-demo.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static demo
        run: npm run build:demo

      # Pages runs Jekyll by default, which strips paths beginning with an
      # underscore — including the whole _next directory.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-artifact@v4
        with:
          name: demo-pages
          path: out
          retention-days: 7
