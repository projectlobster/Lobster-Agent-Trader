name: Deploy demo to GitHub Pages

# GitHub Pages can only host static files, so this publishes the landing page as
# a product demo. The console is NOT part of it — that needs a Node server, a
# Python process for the agent kit, and a writable SQLite file, none of which
# Pages provides. See README for how to run the console yourself.
on:
  push:
    branches: [main]
    paths:
      - "src/app/page.tsx"
      - "src/app/layout.tsx"
      - "src/app/globals.css"
      - "src/components/site/**"
      - "src/components/ui/**"
      - "scripts/build-demo.ts"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "postcss.config.mjs"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static demo
        run: npm run build:demo

      # Pages runs Jekyll by default, which strips files and directories that
      # start with an underscore — including _next.
      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      # Publishing by pushing the built output keeps this consistent with the
      # repository's legacy gh-pages setup. The actions/deploy-pages route needs
      # the github-pages environment, whose branch policy only admits gh-pages,
      # so it cannot be used from a main-branch build.
      - name: Publish to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd out
          git init -q
          git add -A
          git commit -q -m "Deploy demo from ${GITHUB_SHA}"
          git push -q --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
