name: Deploy demo to GitHub Pages

# Publishes the artifact produced by build-demo.yml.
#
# This runs on gh-pages rather than main for a concrete reason: the
# github-pages environment has a branch policy admitting only gh-pages, and a
# deploy job triggered from any other branch is rejected by it.
on:
  workflow_run:
    workflows: ["Build demo"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: demo-pages
          path: out

      - id: deployment
        uses: actions/deploy-pages@v4
